<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Retail Ledger Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}button,input{width:100%;padding:12px;font-size:16px;border-radius:8px}input{border:1px solid #e2e8f0;padding:12px 14px;outline:none}.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef2ff,#f8fafc)}.auth-card{max-width:420px;width:100%;background:#fff;padding:24px;border-radius:16px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:6px;font-size:14px;color:#334155;font-weight:600}.container{padding:20px;max-width:1200px;margin:0 auto}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0}.mini-card,.card,.inventory-item,.history-item{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.mini-card span{display:block;color:#64748b;font-size:13px;margin-bottom:8px}.mini-card strong{font-size:28px;color:#0f172a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.status-badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#ecfeff;color:#0f766e;font-weight:700;font-size:12px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px}.logout-btn,.delete-btn{background:#ef4444;color:#fff;border:none;cursor:pointer}.inventory-list,.history-list{display:grid;gap:12px}.inventory-item,.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px}.stock-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:#475569}.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:24px}.modal-content{background:#fff;border-radius:18px;padding:24px;max-width:420px;text-align:center}.modal-content button{margin-top:12px;background:#4f46e5;color:#fff;border:none}.hide{display:none!important}
  </style>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div style="font-size:32px">🛍️</div>
      <h2>Create Vendor Profile</h2>
      <p style="color:#64748b;font-size:14px">Setup your digital ledger.</p>

      <div class="form-group">
        <label for="vendorName">Owner Name</label>
        <input id="vendorName" placeholder="Rahul Sharma">
      </div>
      <div class="form-group">
        <label for="shopName">Shop Name</label>
        <input id="shopName" placeholder="Sharma Traders">
      </div>
      <div class="form-group">
        <label for="businessType">Business Type</label>
        <input id="businessType" placeholder="Grocery / Electronics">
      </div>
      <div class="form-group">
        <label for="vendorPhone">Phone Number</label>
        <input id="vendorPhone" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label for="vendorEmail">Email</label>
        <input id="vendorEmail" type="email" placeholder="owner@example.com">
      </div>
      <div class="form-group">
        <label for="vendorPassword">Password</label>
        <input id="vendorPassword" type="password" placeholder="Minimum 6 characters">
      </div>
      <button id="signUpButton">Create Vendor Profile</button>
    </div>
  </section>

  <main class="container hide" id="appMain">
    <header class="header" style="display:flex;align-items:center;justify-content:space-between;gap:20px;">
      <div>
        <h1 id="displayShopName">Smart Retail Ledger</h1>
        <p id="displayOwnerName" style="margin:4px 0;color:#64748b">Welcome Back</p>
        <div id="premiumStatus" class="status-badge">Standard</div>
      </div>
      <button id="logoutButton" class="logout-btn">Logout</button>
    </header>

    <div class="summary-grid">
      <div class="mini-card"><span>Total Items</span><strong id="totalItems">0</strong></div>
      <div class="mini-card"><span>Available Stock</span><strong id="availableStock">0</strong></div>
      <div class="mini-card"><span>Low Stock</span><strong id="lowStockCount">0</strong></div>
      <div class="mini-card"><span>Revenue</span><strong id="totalRevenue">₹0</strong></div>
    </div>

    <div class="grid">
      <section class="card">
        <h3>Log New Stock</h3>
        <div class="form-group"><label for="productId">Physical Tag ID</label><input id="productId" placeholder="101"></div>
        <div class="form-group"><label for="productName">Product Name</label><input id="productName" placeholder="Rice 5kg"></div>
        <div class="form-group"><label for="purchasePrice">Purchase Price</label><input id="purchasePrice" type="number" placeholder="40"></div>
        <div class="form-group"><label for="sellingPrice">Selling Price</label><input id="sellingPrice" type="number" placeholder="50"></div>
        <div class="form-group"><label for="quantity">Quantity</label><input id="quantity" type="number" placeholder="20"></div>
        <button id="addStockButton">Add Stock</button>
      </section>

      <section class="card">
        <h3>Inventory List</h3>
        <div id="inventoryList" class="inventory-list"></div>
      </section>

      <section class="card">
        <h3>History</h3>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>

    <div id="premiumModal" class="modal" style="display:none;">
      <div class="modal-content">
        <div style="font-size:40px">👑</div>
        <h2>Premium Required</h2>
        <p style="color:#64748b">Free tier limit reached. Pay ₹99/month for unlimited stock and vendor analytics.</p>
        <button id="premiumCloseButton">Continue Trial</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      collection,
      addDoc,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA8Aw8yDNhVhH_Ogjf1b4kS0CWcJm8l_J0",
      authDomain: "smart-inventory-4afbb.firebaseapp.com",
      projectId: "smart-inventory-4afbb",
      storageBucket: "smart-inventory-4afbb.firebasestorage.app",
      messagingSenderId: "835911902484",
      appId: "1:835911902484:web:9d72422655c2223a070e01",
      measurementId: "G-39V1BVQ7XN"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.firebaseApp = app;
      window.firebaseAuth = auth;
      window.firebaseDb = db;
      window.firebaseHelpers = {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
        doc,
        setDoc,
        getDoc,
        collection,
        addDoc,
        getDocs
      };
      window.firebaseReady = true;
      console.log("Firebase connected successfully");
    } catch (error) {
      console.error("Firebase init failed:", error);
      window.firebaseReady = false;
    }
  </script>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const K = { i: 'virtualLedger', h: 'historyArchive', p: 'vendorProfile', pr: 'isPremiumUser', a: 'premiumActivatedAt' };

      let inv = read(K.i, []), hist = read(K.h, []), profile = read(K.p, null);

      function read(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function write(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
      }

      function renderSummary() {
        const totalItems = inv.length;
        const availableStock = inv.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
        const lowStockCount = inv.filter(item => Number(item.quantity) <= 5).length;
        const totalRevenue = inv.reduce((sum, item) => sum + ((Number(item.sellingPrice) || 0) * (Number(item.quantity) || 0)), 0);

        $('totalItems').textContent = totalItems;
        $('availableStock').textContent = availableStock;
        $('lowStockCount').textContent = lowStockCount;
        $('totalRevenue').textContent = `₹${totalRevenue.toLocaleString('en-IN')}`;
      }

      function renderInventory() {
        const list = $('inventoryList');
        if (!inv.length) {
          list.innerHTML = '<p style="color:#64748b">No inventory items yet.</p>';
          return;
        }

        list.innerHTML = inv.map((item, index) => `
          <div class="inventory-item">
            <div>
              <strong>${item.name || 'Unnamed Item'}</strong>
              <small>ID: ${item.id || 'N/A'}</small>
            </div>
            <div class="stock-meta">
              <span>Qty: ${item.quantity || 0}</span>
              <span>₹${item.sellingPrice || 0}</span>
              <button class="delete-btn" data-index="${index}">Delete</button>
            </div>
          </div>
        `).join('');

        list.querySelectorAll('.delete-btn').forEach(btn => {
          btn.onclick = () => {
            inv.splice(Number(btn.dataset.index), 1);
            write(K.i, inv);
            renderInventory();
            renderSummary();
          };
        });
      }

      function renderHistory() {
        const list = $('historyList');
        if (!hist.length) {
          list.innerHTML = '<p style="color:#64748b">No history yet.</p>';
          return;
        }
        list.innerHTML = hist.slice().reverse().map(entry => `
          <div class="history-item">
            <strong>${entry.type || 'Update'}</strong>
            <small>${entry.message || 'Inventory updated'}</small>
          </div>
        `).join('');
      }

      function updateProfileUI() {
        const main = $('appMain');
        if (profile) {
          $('displayShopName').textContent = profile.shopName || 'Smart Retail Ledger';
          $('displayOwnerName').textContent = profile.ownerName || 'Welcome Back';
          $('authScreen').classList.add('hide');
          main.classList.remove('hide');
        } else {
          $('authScreen').classList.remove('hide');
          main.classList.add('hide');
        }
      }

      function addHistory(type, message) {
        hist.push({ type, message, time: new Date().toISOString() });
        if (hist.length > 25) hist = hist.slice(-25);
        write(K.h, hist);
        renderHistory();
      }

      $('signUpButton').onclick = async () => {
        const owner = $('vendorName').value.trim();
        const shop = $('shopName').value.trim();
        const businessType = $('businessType').value.trim();
        const phone = $('vendorPhone').value.trim();
        const email = $('vendorEmail').value.trim();
        const password = $('vendorPassword').value.trim();

        if (!owner || !shop || !businessType || !phone || !email || !password) {
          alert('Please fill all fields correctly.');
          return;
        }

        if (password.length < 6) {
          alert('Password should be at least 6 characters long.');
          return;
        }

        try {
          if (window.firebaseReady && window.firebaseAuth) {
            const userCredential = await window.firebaseHelpers.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
            const user = userCredential.user;
            profile = { ownerName: owner, shopName: shop, businessType, phone, email, uid: user.uid };
            write(K.p, profile);

            if (window.firebaseDb) {
              await window.firebaseHelpers.setDoc(window.firebaseHelpers.doc(window.firebaseDb, 'users', user.uid), {
                ownerName: owner,
                shopName: shop,
                businessType,
                phone,
                email,
                createdAt: new Date().toISOString()
              });
            }
          } else {
            profile = { ownerName: owner, shopName: shop, businessType, phone, email };
            write(K.p, profile);
          }

          addHistory('Profile', 'Vendor profile created successfully.');
          updateProfileUI();
        } catch (error) {
          console.error(error);
          alert('Unable to create profile. Error: ' + (error.message || 'Unknown error'));
        }
      };

      $('logoutButton').onclick = async () => {
        try {
          if (window.firebaseReady && window.firebaseAuth) {
            await window.firebaseHelpers.signOut(window.firebaseAuth);
          }
          profile = null;
          write(K.p, null);
          updateProfileUI();
        } catch (error) {
          console.error(error);
        }
      };

      $('addStockButton').onclick = () => {
        const productId = $('productId').value.trim();
        const name = $('productName').value.trim();
        const purchasePrice = Number($('purchasePrice').value);
        const sellingPrice = Number($('sellingPrice').value);
        const quantity = Number($('quantity').value);

        if (!productId || !name || !purchasePrice || !sellingPrice || !quantity) {
          alert('Please fill all stock fields.');
          return;
        }

        const newItem = { id: productId, name, purchasePrice, sellingPrice, quantity };
        inv.push(newItem);
        write(K.i, inv);
        addHistory('Stock Added', `${name} added with quantity ${quantity}.`);
        renderInventory();
        renderSummary();
        ['productId', 'productName', 'purchasePrice', 'sellingPrice', 'quantity'].forEach(id => $(id).value = '');
      };

      $('premiumCloseButton').onclick = () => {
        $('premiumModal').style.display = 'none';
      };

      renderInventory();
      renderHistory();
      renderSummary();
      updateProfileUI();
    })();
  </script>
</body>
</html>
