<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Retail Ledger Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}.container{max-width:1180px;margin:auto;padding:24px}.hide{display:none!important}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card,.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 25px #0f172a12}.auth-card{width:min(100%,460px);padding:28px}.form-group{margin:14px 0}label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}button,input{width:100%;padding:12px;font-size:16px;border-radius:8px}input{border:1px solid #e2e8f0;background:#fff}button{border:0;background:#4f46e5;color:#fff;cursor:pointer;font-weight:700}button:hover{filter:brightness(.95)}.header{margin-bottom:20px}.header h1{margin:0;font-size:clamp(24px,4vw,36px)}.logout-btn{width:auto;background:#e2e8f0;color:#0f172a;padding:10px 18px}.status-badge{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;font-weight:700}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.mini-card{padding:18px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.mini-card span{display:block;color:#64748b;font-size:13px}.mini-card strong{display:block;margin-top:8px;font-size:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{padding:20px}.card h3{margin-top:0}.inventory-list,.history-list{display:grid;gap:10px}.inventory-item,.history-item{border:1px solid #e2e8f0;border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.inventory-item strong,.history-item strong{display:block}.inventory-item small,.history-item small{display:block;color:#64748b;margin-top:5px}.stock-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stock-meta span{white-space:nowrap;color:#334155}.small-btn{width:auto;padding:8px 10px;font-size:13px}.sell-btn{background:#059669}.delete-btn,.history-delete-btn{background:#dc2626}.history-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.history-header h3{margin:0}.clear-history-btn{width:auto;background:#fee2e2;color:#b91c1c;padding:8px 10px;font-size:13px}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px}.modal-content{background:#fff;border-radius:16px;padding:28px;text-align:center;max-width:400px;width:100%}@media(max-width:760px){.container{padding:14px}.summary-grid{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.inventory-item{align-items:flex-start;flex-direction:column}.stock-meta{justify-content:flex-start}.stock-meta button{flex:1}.header{align-items:flex-start!important;flex-direction:column}.logout-btn{width:100%}}
  </style>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div style="font-size:32px">🛍️</div><h2>Create Vendor Profile</h2><p style="color:#64748b;font-size:14px">Setup your digital ledger.</p>
      <div class="form-group"><label for="vendorName">Owner Name</label><input id="vendorName" placeholder="Rahul Sharma"></div>
      <div class="form-group"><label for="shopName">Shop Name</label><input id="shopName" placeholder="Sharma Traders"></div>
      <div class="form-group"><label for="businessType">Business Type</label><input id="businessType" placeholder="Grocery / Electronics"></div>
      <div class="form-group"><label for="vendorPhone">Phone Number</label><input id="vendorPhone" placeholder="+91 98765 43210"></div>
      <div class="form-group"><label for="vendorEmail">Email</label><input id="vendorEmail" type="email" placeholder="owner@example.com"></div>
      <div class="form-group"><label for="vendorPassword">Password</label><input id="vendorPassword" type="password" placeholder="Minimum 6 characters"></div>
      <button id="signUpButton">Create Vendor Profile</button>
    </div>
  </section>

  <main class="container hide" id="appMain">
    <header class="header" style="display:flex;align-items:center;justify-content:space-between;gap:20px"><div><h1 id="displayShopName">Smart Retail Ledger</h1><p id="displayOwnerName" style="margin:4px 0;color:#64748b">Welcome Back</p><div id="premiumStatus" class="status-badge">Standard</div></div><button id="logoutButton" class="logout-btn">Logout</button></header>
    <div class="summary-grid"><div class="mini-card"><span>Total Items</span><strong id="totalItems">0</strong></div><div class="mini-card"><span>Available Stock</span><strong id="availableStock">0</strong></div><div class="mini-card"><span>Low Stock</span><strong id="lowStockCount">0</strong></div><div class="mini-card"><span>Revenue</span><strong id="totalRevenue">₹0</strong></div></div>
    <div class="grid">
      <section class="card"><h3>Log New Stock</h3><div class="form-group"><label for="productId">Physical Tag ID</label><input id="productId" placeholder="101"></div><div class="form-group"><label for="productName">Product Name</label><input id="productName" placeholder="Rice 5kg"></div><div class="form-group"><label for="purchasePrice">Purchase Price</label><input id="purchasePrice" type="number" min="0" placeholder="40"></div><div class="form-group"><label for="sellingPrice">Selling Price</label><input id="sellingPrice" type="number" min="0" placeholder="50"></div><div class="form-group"><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" placeholder="20"></div><button id="addStockButton">Add Stock</button></section>
      <section class="card"><h3>Inventory List</h3><div id="inventoryList" class="inventory-list"></div></section>
      <section class="card"><div class="history-header"><h3>History</h3><button id="clearHistoryButton" class="clear-history-btn">Clear History</button></div><div id="historyList" class="history-list"></div></section>
    </div>
    <div id="premiumModal" class="modal" style="display:none"><div class="modal-content"><div style="font-size:40px">👑</div><h2>Premium Required</h2><p style="color:#64748b">Free tier limit reached. Pay ₹99/month for unlimited stock and vendor analytics.</p><button id="premiumCloseButton">Continue Trial</button></div></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    const firebaseConfig={apiKey:"AIzaSyA8Aw8yDNhVhH_Ogjf1b4kS0CWcJm8l_J0",authDomain:"smart-inventory-4afbb.firebaseapp.com",projectId:"smart-inventory-4afbb",storageBucket:"smart-inventory-4afbb.firebasestorage.app",messagingSenderId:"835911902484",appId:"1:835911902484:web:9d72422655c2223a070e01",measurementId:"G-39V1BVQ7XN"};
    try{const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);window.firebaseApp=app;window.firebaseAuth=auth;window.firebaseDb=db;window.firebaseHelpers={createUserWithEmailAndPassword,onAuthStateChanged,signOut,doc,setDoc,collection,addDoc,getDocs,deleteDoc};window.firebaseReady=true;console.log("Firebase connected successfully")}catch(error){console.error("Firebase init failed:",error);window.firebaseReady=false}
  </script>
  <script>
    (()=>{
      const $=id=>document.getElementById(id),K={i:'virtualLedger',h:'historyArchive',p:'vendorProfile',pr:'isPremiumUser',a:'premiumActivatedAt'};
      let inv=read(K.i,[]),hist=read(K.h,[]),profile=read(K.p,null);
      function read(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
      function write(key,val){localStorage.setItem(key,JSON.stringify(val))}
      async function saveInventoryToFirebase(){if(!window.firebaseReady||!window.firebaseAuth||!window.firebaseDb)return;const user=window.firebaseAuth.currentUser;if(!user)return;try{const inventoryPath=window.firebaseHelpers.collection(window.firebaseDb,'users',user.uid,'inventory'),historyPath=window.firebaseHelpers.collection(window.firebaseDb,'users',user.uid,'history');for(const snap of [await window.firebaseHelpers.getDocs(inventoryPath),await window.firebaseHelpers.getDocs(historyPath)])for(const item of snap.docs)await window.firebaseHelpers.deleteDoc(item.ref);for(const item of inv)await window.firebaseHelpers.addDoc(inventoryPath,{...item,createdAt:new Date().toISOString()});for(const entry of hist)await window.firebaseHelpers.addDoc(historyPath,{...entry,createdAt:new Date().toISOString()})}catch(error){console.error('Firebase save error:',error)}}
      async function loadInventoryFromFirebase(){if(!window.firebaseReady||!window.firebaseAuth||!window.firebaseDb)return;const user=window.firebaseAuth.currentUser;if(!user)return;try{const ip=window.firebaseHelpers.collection(window.firebaseDb,'users',user.uid,'inventory'),hp=window.firebaseHelpers.collection(window.firebaseDb,'users',user.uid,'history');const is=await window.firebaseHelpers.getDocs(ip),hs=await window.firebaseHelpers.getDocs(hp);inv=is.docs.map(d=>({id:d.data().id||d.id,...d.data()}));hist=hs.docs.map(d=>({id:d.id,...d.data()}));write(K.i,inv);write(K.h,hist);renderAll()}catch(error){console.error('Firebase load error:',error)}}
      function renderSummary(){const available=inv.reduce((s,i)=>s+(Number(i.quantity)||0),0),low=inv.filter(i=>(Number(i.quantity)||0)<=5).length,revenue=inv.reduce((s,i)=>s+(Number(i.sellingPrice)||0)*(Number(i.quantity)||0),0);$('totalItems').textContent=inv.length;$('availableStock').textContent=available;$('lowStockCount').textContent=low;$('totalRevenue').textContent=`₹${revenue.toLocaleString('en-IN')}`}
      function renderInventory(){const list=$('inventoryList');if(!inv.length){list.innerHTML='<p style="color:#64748b">No inventory items yet.</p>';return}list.innerHTML=inv.map((item,index)=>`<div class="inventory-item"><div><strong>${escapeHtml(item.name||'Unnamed Item')}</strong><small>ID: ${escapeHtml(item.id||'N/A')} · Purchase: ₹${item.purchasePrice||0}</small></div><div class="stock-meta"><span>Qty: <b>${item.quantity||0}</b></span><span>Sell: ₹${item.sellingPrice||0}</span><button class="small-btn sell-btn" data-action="sell" data-index="${index}">Sell</button><button class="small-btn delete-btn" data-action="delete" data-index="${index}">Delete</button></div></div>`).join('');list.querySelectorAll('button').forEach(btn=>btn.onclick=()=>btn.dataset.action==='sell'?sellStock(Number(btn.dataset.index)):deleteStock(Number(btn.dataset.index)))}
      function renderHistory(){const list=$('historyList');if(!hist.length){list.innerHTML='<p style="color:#64748b">No history yet.</p>';return}list.innerHTML=hist.slice().reverse().map((entry,index)=>`<div class="history-item"><div><strong>${escapeHtml(entry.type||'Update')}</strong><small>${escapeHtml(entry.message||'Inventory updated')} · ${entry.time?new Date(entry.time).toLocaleString('en-IN'):''}</small></div><button class="small-btn history-delete-btn" data-index="${hist.length-1-index}">Remove</button></div>`).join('');list.querySelectorAll('.history-delete-btn').forEach(btn=>btn.onclick=()=>{hist.splice(Number(btn.dataset.index),1);write(K.h,hist);renderHistory();saveInventoryToFirebase()})}
      function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
      function renderAll(){renderInventory();renderHistory();renderSummary()}
      function updateProfileUI(){if(profile){$('displayShopName').textContent=profile.shopName||'Smart Retail Ledger';$('displayOwnerName').textContent=profile.ownerName||'Welcome Back';$('authScreen').classList.add('hide');$('appMain').classList.remove('hide')}else{$('authScreen').classList.remove('hide');$('appMain').classList.add('hide')}}
      function addHistory(type,message){hist.push({type,message,time:new Date().toISOString()});if(hist.length>50)hist=hist.slice(-50);write(K.h,hist);renderHistory()}
      async function sellStock(index){const item=inv[index];if(!item)return;const available=Number(item.quantity)||0;if(available<=0){alert('This item is out of stock.');return}const raw=prompt(`How many ${item.name} sold?`, '1');if(raw===null)return;const amount=Number(raw);if(!Number.isInteger(amount)||amount<1||amount>available){alert(`Enter a whole number between 1 and ${available}.`);return}item.quantity=available-amount;addHistory('Sale Recorded',`${item.name} sold: ${amount}. Remaining quantity: ${item.quantity}.`);write(K.i,inv);renderAll();await saveInventoryToFirebase()}
      function deleteStock(index){const item=inv[index];if(!item||!confirm(`Delete ${item.name||'this item'}?`))return;inv.splice(index,1);addHistory('Stock Removed',`${item.name||'Item'} removed from inventory.`);write(K.i,inv);renderAll();saveInventoryToFirebase()}
      $('signUpButton').onclick=async()=>{const owner=$('vendorName').value.trim(),shop=$('shopName').value.trim(),businessType=$('businessType').value.trim(),phone=$('vendorPhone').value.trim(),email=$('vendorEmail').value.trim(),password=$('vendorPassword').value.trim();if(!owner||!shop||!businessType||!phone||!email||!password){alert('Please fill all fields correctly.');return}if(password.length<6){alert('Password should be at least 6 characters long.');return}try{if(window.firebaseReady&&window.firebaseAuth){const c=await window.firebaseHelpers.createUserWithEmailAndPassword(window.firebaseAuth,email,password);profile={ownerName:owner,shopName:shop,businessType,phone,email,uid:c.user.uid};write(K.p,profile);await window.firebaseHelpers.setDoc(window.firebaseHelpers.doc(window.firebaseDb,'users',c.user.uid),{ownerName:owner,shopName:shop,businessType,phone,email,createdAt:new Date().toISOString()})}else{profile={ownerName:owner,shopName:shop,businessType,phone,email};write(K.p,profile)}addHistory('Profile','Vendor profile created successfully.');updateProfileUI();await saveInventoryToFirebase()}catch(error){console.error(error);alert('Unable to create profile. Error: '+(error.message||'Unknown error'))}};
      $('logoutButton').onclick=async()=>{try{if(window.firebaseReady&&window.firebaseAuth)await window.firebaseHelpers.signOut(window.firebaseAuth);profile=null;write(K.p,null);updateProfileUI()}catch(error){console.error(error)}};
      $('addStockButton').onclick=async()=>{const productId=$('productId').value.trim(),name=$('productName').value.trim(),purchasePrice=Number($('purchasePrice').value),sellingPrice=Number($('sellingPrice').value),quantity=Number($('quantity').value);if(!productId||!name||purchasePrice<0||sellingPrice<0||quantity<1){alert('Please enter valid stock details.');return}inv.push({id:productId,name,purchasePrice,sellingPrice,quantity});write(K.i,inv);addHistory('Stock Added',`${name} added with quantity ${quantity}.`);renderAll();['productId','productName','purchasePrice','sellingPrice','quantity'].forEach(id=>$(id).value='');await saveInventoryToFirebase()};
      $('clearHistoryButton').onclick=()=>{if(!hist.length)return;if(confirm('Remove all history?')){hist=[];write(K.h,hist);renderHistory();saveInventoryToFirebase()}};$('premiumCloseButton').onclick=()=>{$('premiumModal').style.display='none'};
      function startFirebase(){if(window.firebaseReady&&window.firebaseAuth)window.firebaseHelpers.onAuthStateChanged(window.firebaseAuth,async user=>{if(user){profile={uid:user.uid,email:user.email};write(K.p,profile);await loadInventoryFromFirebase();updateProfileUI()}else{profile=null;write(K.p,null);updateProfileUI()}});else setTimeout(startFirebase,100)}
      renderAll();updateProfileUI();startFirebase();
    })();
  </script>
</body>
</html>
