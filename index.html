<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Smart Inventory</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,Arial,sans-serif}.container{max-width:1180px;margin:auto;padding:20px}.hide{display:none!important}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef2ff,#f8fafc)}.auth-card,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 24px #1720330a}.auth-card{width:min(440px,100%);padding:28px}.auth-card h1{margin:8px 0;font-size:26px}.subtitle,.muted{color:#667085}.form-group{margin:14px 0}.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#475467}.form-group input,.search-input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:12px;font-size:15px;outline:none}.form-group input:focus,.search-input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}button{border:0;border-radius:10px;padding:11px 15px;background:#4f46e5;color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}.secondary{background:#eef2ff;color:#4338ca}.danger{background:#fff1f2;color:#be123c}.logout-btn{background:#fff;color:#475467;border:1px solid #d0d5dd}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.header h1{margin:0;font-size:28px}.header p{margin:5px 0 0}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.mini-card{padding:18px;background:#fff;border:1px solid #e5e7eb;border-radius:15px}.mini-card span{display:block;color:#667085;font-size:13px}.mini-card strong{font-size:28px;display:block;margin-top:8px}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{padding:20px;margin-bottom:18px}.card h2,.card h3{margin:0 0 15px}.inventory-toolbar,.history-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.inventory-toolbar h2,.history-header h2{margin:0}.search-wrap{position:relative;margin-bottom:14px}.search-wrap span{position:absolute;left:12px;top:11px}.search-input{padding-left:38px}.inventory-list,.history-list{display:grid;gap:10px}.inventory-item,.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #eaecf0;border-radius:12px}.inventory-item strong,.history-item strong{display:block}.inventory-item small,.history-item small{display:block;color:#667085;margin-top:5px}.stock-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;color:#667085;font-size:13px}.small-btn{padding:8px 10px;font-size:12px}.badge{font-size:12px;border-radius:999px;padding:5px 8px;background:#ecfdf3;color:#027a48}.badge.empty{background:#fff1f2;color:#be123c}.clear-history-btn{background:#fff1f2;color:#be123c;padding:8px 10px;font-size:12px}.auth-actions{display:flex;gap:8px;margin-top:16px}.auth-actions button{flex:1}.notice{font-size:13px;color:#667085;background:#f8fafc;padding:10px;border-radius:10px;margin-top:14px}
    @media(max-width:760px){.container{padding:14px}.header{align-items:flex-start}.header h1{font-size:22px}.summary-grid{grid-template-columns:repeat(2,1fr);gap:10px}.mini-card{padding:14px}.mini-card strong{font-size:23px}.grid{display:block}.card{padding:15px}.inventory-item,.history-item{align-items:flex-start;flex-direction:column}.stock-meta{width:100%;justify-content:flex-start}.inventory-toolbar,.history-header{align-items:flex-start}.header .logout-btn{padding:9px 11px}.auth-card{padding:22px}}
  </style>
</head>
<body>
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div style="font-size:34px">🛍️</div><h1>Smart Inventory</h1><p class="subtitle">Manage your shop stock simply.</p>
      <div class="form-group"><label for="vendorName">Owner Name</label><input id="vendorName" placeholder="Rahul Sharma"></div>
      <div class="form-group"><label for="shopName">Shop Name</label><input id="shopName" placeholder="Sharma Traders"></div>
      <div class="form-group"><label for="vendorEmail">Email</label><input id="vendorEmail" type="email" placeholder="owner@example.com"></div>
      <div class="form-group"><label for="vendorPassword">Password</label><input id="vendorPassword" type="password" placeholder="Minimum 6 characters"></div>
      <button id="signUpButton" style="width:100%">Create / Login</button>
      <p id="authMessage" class="notice">Your dashboard will appear here after login.</p>
    </div>
  </section>

  <main class="container hide" id="appMain">
    <header class="header"><div><h1 id="displayShopName">Smart Inventory</h1><p id="displayOwnerName" class="muted">Welcome back</p></div><button id="logoutButton" class="logout-btn">Logout</button></header>
    <section class="summary-grid"><div class="mini-card"><span>Products</span><strong id="totalItems">0</strong></div><div class="mini-card"><span>Available Units</span><strong id="availableStock">0</strong></div><div class="mini-card"><span>Low Stock</span><strong id="lowStockCount">0</strong></div><div class="mini-card"><span>Stock Value</span><strong id="totalRevenue">₹0</strong></div></section>
    <div class="grid">
      <section class="card"><h2>Add New Stock</h2><div class="form-group"><label for="productId">Product ID</label><input id="productId" placeholder="101"></div><div class="form-group"><label for="productName">Product Name</label><input id="productName" placeholder="Rice 5kg"></div><div class="form-group"><label for="purchasePrice">Purchase Price</label><input id="purchasePrice" type="number" min="0" placeholder="40"></div><div class="form-group"><label for="sellingPrice">Selling Price</label><input id="sellingPrice" type="number" min="0" placeholder="50"></div><div class="form-group"><label for="quantity">Quantity</label><input id="quantity" type="number" min="1" placeholder="20"></div><button id="addStockButton" style="width:100%">Add to Inventory</button></section>
      <div>
        <section class="card"><div class="inventory-toolbar"><h2>Current Inventory</h2><span id="inventoryCount" class="muted"></span></div><div class="search-wrap"><span>🔎</span><input id="inventorySearch" class="search-input" placeholder="Search product or ID..."></div><div id="inventoryList" class="inventory-list"></div></section>
        <section class="card"><div class="history-header"><h2>Sold-out History</h2><button id="clearHistoryButton" class="clear-history-btn">Clear</button></div><p class="muted" style="font-size:13px;margin-top:-5px">Only products that are completely sold are shown here.</p><div id="historyList" class="history-list"></div></section>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    const firebaseConfig={apiKey:"AIzaSyA8Aw8yDNVhH_HOgjf1b4kS0CWcJm8l_J0",authDomain:"smart-inventory-4afbb.firebaseapp.com",projectId:"smart-inventory-4afbb",storageBucket:"smart-inventory-4afbb.firebasestorage.app",messagingSenderId:"835911902484",appId:"1:835911902484:web:9d72422655c2223a070e01"};
    try{const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);window.firebaseAuth=auth;window.firebaseDb=db;window.firebaseHelpers={createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,doc,setDoc,collection,addDoc,getDocs,deleteDoc};window.firebaseReady=true}catch(e){console.error(e);window.firebaseReady=false}
  </script>
  <script>
    (()=>{const $=id=>document.getElementById(id),K={i:'virtualLedger',h:'historyArchive',p:'vendorProfile'};let inv=read(K.i,[]),hist=read(K.h,[]),profile=read(K.p,null);
      function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
      async function sync(){if(!window.firebaseReady||!window.firebaseAuth.currentUser)return;try{const u=window.firebaseAuth.currentUser,ip=window.firebaseHelpers.collection(window.firebaseDb,'users',u.uid,'inventory'),hp=window.firebaseHelpers.collection(window.firebaseDb,'users',u.uid,'history');for(const snap of [await window.firebaseHelpers.getDocs(ip),await window.firebaseHelpers.getDocs(hp)])for(const d of snap.docs)await window.firebaseHelpers.deleteDoc(d.ref);for(const item of inv)await window.firebaseHelpers.addDoc(ip,item);for(const item of hist)await window.firebaseHelpers.addDoc(hp,item)}catch(e){console.error('Sync error',e)}}
      async function load(){if(!window.firebaseReady||!window.firebaseAuth.currentUser)return;try{const u=window.firebaseAuth.currentUser,ip=window.firebaseHelpers.collection(window.firebaseDb,'users',u.uid,'inventory'),hp=window.firebaseHelpers.collection(window.firebaseDb,'users',u.uid,'history');const [is,hs]=await Promise.all([window.firebaseHelpers.getDocs(ip),window.firebaseHelpers.getDocs(hp)]);if(!is.empty)inv=is.docs.map(d=>d.data());if(!hs.empty)hist=hs.docs.map(d=>d.data());write(K.i,inv);write(K.h,hist);renderAll()}catch(e){console.error('Load error',e)}}
      function renderSummary(){const available=inv.reduce((s,i)=>s+(Number(i.quantity)||0),0),low=inv.filter(i=>Number(i.quantity)>0&&Number(i.quantity)<=5).length,value=inv.reduce((s,i)=>s+(Number(i.sellingPrice)||0)*(Number(i.quantity)||0),0);$('totalItems').textContent=inv.length;$('availableStock').textContent=available;$('lowStockCount').textContent=low;$('totalRevenue').textContent='₹'+value.toLocaleString('en-IN')}
      function renderInventory(){const q=$('inventorySearch').value.trim().toLowerCase(),items=inv.map((x,index)=>({...x,index})).filter(x=>!q||String(x.name).toLowerCase().includes(q)||String(x.id).toLowerCase().includes(q));$('inventoryCount').textContent=`${items.length}/${inv.length}`;const list=$('inventoryList');if(!items.length){list.innerHTML='<p class="muted">No matching products found.</p>';return}list.innerHTML=items.map(x=>`<div class="inventory-item"><div><strong>${escapeHtml(x.name||'Unnamed product')}</strong><small>ID: ${escapeHtml(x.id||'N/A')} · Sell: ₹${Number(x.sellingPrice)||0}</small></div><div class="stock-meta"><span class="badge ${Number(x.quantity)<=0?'empty':''}">${Number(x.quantity)||0} left</span>${Number(x.quantity)>0?`<button class="small-btn sell-btn" data-index="${x.index}">Sell 1</button>`:''}<button class="small-btn danger delete-btn" data-index="${x.index}">Delete</button></div></div>`).join('');list.querySelectorAll('.sell-btn').forEach(b=>b.onclick=()=>sellStock(Number(b.dataset.index)));list.querySelectorAll('.delete-btn').forEach(b=>b.onclick=()=>deleteStock(Number(b.dataset.index)))}
      function renderHistory(){const sold=hist.filter(x=>x.soldOut);const list=$('historyList');if(!sold.length){list.innerHTML='<p class="muted">No sold-out products yet.</p>';return}list.innerHTML=sold.slice().reverse().map((x,i)=>`<div class="history-item"><div><strong>${escapeHtml(x.name||'Product')}</strong><small>${escapeHtml(x.message||'Completely sold out')} · ${new Date(x.time).toLocaleString('en-IN')}</small></div><span class="badge empty">Sold out</span></div>`).join('')}
      function renderAll(){renderInventory();renderHistory();renderSummary()}function addHistory(name,message){hist.push({name,message,time:new Date().toISOString(),soldOut:true});hist=hist.slice(-50);write(K.h,hist)}
      async function sellStock(index){const item=inv[index];if(!item||Number(item.quantity)<=0)return;item.quantity=Number(item.quantity)-1;if(item.quantity===0)addHistory(item.name,`${item.name} completely sold out.`);write(K.i,inv);renderAll();await sync()}
      function deleteStock(index){if(!inv[index])return;inv.splice(index,1);write(K.i,inv);renderAll();sync()}
      function updateProfile(){if(profile){$('displayShopName').textContent=profile.shopName||'Smart Inventory';$('displayOwnerName').textContent=`Welcome, ${profile.ownerName||'shop owner'}`;$('authScreen').classList.add('hide');$('appMain').classList.remove('hide')}else{$('authScreen').classList.remove('hide');$('appMain').classList.add('hide')}}
      $('inventorySearch').oninput=renderInventory;$('addStockButton').onclick=async()=>{const item={id:$('productId').value.trim(),name:$('productName').value.trim(),purchasePrice:Number($('purchasePrice').value),sellingPrice:Number($('sellingPrice').value),quantity:Number($('quantity').value)};if(!item.id||!item.name||item.quantity<1||item.purchasePrice<0||item.sellingPrice<0)return alert('Please enter valid stock details.');inv.push(item);write(K.i,inv);['productId','productName','purchasePrice','sellingPrice','quantity'].forEach(id=>$(id).value='');renderAll();await sync()};
      $('clearHistoryButton').onclick=async()=>{hist=hist.filter(x=>!x.soldOut);write(K.h,hist);renderHistory();await sync()};$('logoutButton').onclick=async()=>{if(window.firebaseReady)await window.firebaseHelpers.signOut(window.firebaseAuth);profile=null;write(K.p,null);updateProfile()};
      $('signUpButton').onclick=async()=>{const email=$('vendorEmail').value.trim(),password=$('vendorPassword').value,owner=$('vendorName').value.trim(),shop=$('shopName').value.trim();if(!email||password.length<6)return $('authMessage').textContent='Enter a valid email and 6+ character password.';try{let user;if(window.firebaseReady){try{user=(await window.firebaseHelpers.signInWithEmailAndPassword(window.firebaseAuth,email,password)).user}catch{user=(await window.firebaseHelpers.createUserWithEmailAndPassword(window.firebaseAuth,email,password)).user}}profile={uid:user?.uid||email,email,ownerName:owner,shopName:shop};write(K.p,profile);updateProfile();await load()}catch(e){$('authMessage').textContent=e.message||'Login failed.'}};
      if(window.firebaseReady)window.firebaseHelpers.onAuthStateChanged(window.firebaseAuth,async user=>{if(user){profile=read(K.p,{uid:user.uid,email:user.email});profile.uid=user.uid;write(K.p,profile);updateProfile();await load()}else updateProfile()});renderAll();updateProfile();
    })();
  </script>
</body>
</html>
