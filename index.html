<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Inventory - Vendor Inventory Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- PDF Generation Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- ================= FIREBASE SDK (Compat Version for HTML) ================= -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #6C5CE7; --primary-dark: #5A4BD1; --primary-light: #A29BFE;
  --secondary: #00B894; --accent: #FDCB6E; --danger: #E17055;
  --bg: #F8F9FE; --card: #FFFFFF; --text: #2D3436; --text-light: #636E72;
  --border: #E8E8F0; --shadow: 0 2px 20px rgba(108, 92, 231, 0.08);
  --shadow-lg: 0 8px 40px rgba(108, 92, 231, 0.15);
}

body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
body.hindi { font-family: 'Noto Sans Devanagari', 'Inter', sans-serif; }

/* LANGUAGE SWITCHER */
.lang-switch-wrap { display:flex; justify-content:center; gap:6px; margin-bottom:18px; }
.lang-pill { display:inline-flex; background:rgba(255,255,255,0.25); border-radius:14px; padding:4px; backdrop-filter:blur(10px); }
.lang-opt { border:none; background:transparent; color:#fff; font-family:'Inter','Noto Sans Devanagari',sans-serif; font-weight:700; font-size:13px; padding:7px 16px; border-radius:11px; cursor:pointer; transition:all .25s; }
.lang-opt.active { background:#fff; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,.15); }
.top-lang-btn { position:relative; }
.top-lang-btn .lang-label { font-size:11px; font-weight:800; letter-spacing:.5px; }

/* SPLASH SCREEN */
.splash-screen { position:fixed; inset:0; background:linear-gradient(135deg,#6C5CE7 0%,#A29BFE 50%,#74B9FF 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10000; transition:opacity .5s,visibility .5s; }
.splash-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.splash-logo { width:100px; height:100px; background:white; border-radius:28px; display:flex; align-items:center; justify-content:center; font-size:48px; margin-bottom:20px; animation:splashPulse 1.5s ease-in-out infinite; box-shadow:0 10px 40px rgba(0,0,0,.2); }
@keyframes splashPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.splash-title { color:white; font-size:32px; font-weight:800; letter-spacing:-1px; }
.splash-subtitle { color:rgba(255,255,255,.8); font-size:14px; margin-top:8px; font-weight:400; }

/* AUTH PAGES */
.auth-container { min-height:100vh; display:none; flex-direction:column; background:var(--bg); }
.auth-container.active { display:flex; }
.auth-header { background:linear-gradient(135deg,#6C5CE7 0%,#A29BFE 100%); padding:50px 30px 40px; border-radius:0 0 40px 40px; text-align:center; position:relative; overflow:hidden; }
.auth-header::before { content:''; position:absolute; top:-50%; right:-30%; width:200px; height:200px; background:rgba(255,255,255,.1); border-radius:50%; }
.auth-header::after { content:''; position:absolute; bottom:-20%; left:-20%; width:150px; height:150px; background:rgba(255,255,255,.08); border-radius:50%; }
.auth-logo { width:70px; height:70px; background:white; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 16px; box-shadow:0 8px 30px rgba(0,0,0,.15); position:relative; z-index:1; }
.auth-header h1 { color:white; font-size:26px; font-weight:800; position:relative; z-index:1; }
.auth-header p { color:rgba(255,255,255,.85); font-size:14px; margin-top:6px; position:relative; z-index:1; }
.auth-form { padding:30px 24px; flex:1; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:var(--text-light); margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px; }
.form-group input, .form-group select { width:100%; padding:14px 16px; border:2px solid var(--border); border-radius:14px; font-size:15px; font-family:inherit; transition:all .3s; background:white; color:var(--text); }
.form-group input:focus, .form-group select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(108,92,231,.1); }
.form-group input::placeholder { color:#B2BEC3; }

.btn { width:100%; padding:16px; border:none; border-radius:14px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; transition:all .3s; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary { background:linear-gradient(135deg,#6C5CE7,#A29BFE); color:white; box-shadow:0 4px 20px rgba(108,92,231,.4); }
.btn-primary:active { transform:scale(.97); }
.btn-secondary { background:white; color:var(--primary); border:2px solid var(--primary); }
.btn-success { background:linear-gradient(135deg,#00B894,#55EFC4); color:white; box-shadow:0 4px 20px rgba(0,184,148,.4); }
.auth-switch { text-align:center; margin-top:24px; font-size:14px; color:var(--text-light); }
.auth-switch a { color:var(--primary); font-weight:600; text-decoration:none; cursor:pointer; }
.auth-divider { display:flex; align-items:center; margin:24px 0; gap:12px; }
.auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--border); }
.auth-divider span { font-size:12px; color:var(--text-light); font-weight:500; }

/* MAIN APP */
.app-container { display:none; min-height:100vh; padding-bottom:90px; }
.app-container.active { display:block; }
.top-bar { background:linear-gradient(135deg,#6C5CE7,#A29BFE); padding:20px 20px 24px; border-radius:0 0 30px 30px; position:sticky; top:0; z-index:100; }
.top-bar-row { display:flex; align-items:center; justify-content:space-between; }
.top-bar h2 { color:white; font-size:22px; font-weight:800; }
.top-bar-actions { display:flex; gap:10px; }
.top-bar-btn { min-width:40px; height:40px; padding:0 10px; background:rgba(255,255,255,.2); border:none; border-radius:12px; color:white; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all .3s; backdrop-filter:blur(10px); }
.top-bar-btn:active { background:rgba(255,255,255,.3); transform:scale(.95); }

/* TODAY'S PROFIT CARD */
.today-profit-card {
  background: linear-gradient(135deg, #00B894, #55EFC4);
  margin: -10px 20px 16px;
  border-radius: 18px;
  padding: 20px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 8px 25px rgba(0, 184, 148, 0.3);
}
.today-profit-card .tp-icon { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.today-profit-card .tp-info h4 { font-size: 13px; opacity: 0.9; font-weight: 500; }
.today-profit-card .tp-info .tp-amount { font-size: 28px; font-weight: 800; margin-top: 4px; }

.stats-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px 20px; }
.stat-card { background:white; border-radius:18px; padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.stat-card::after { content:''; position:absolute; top:-10px; right:-10px; width:60px; height:60px; border-radius:50%; opacity:.1; }
.stat-card.purple::after{background:var(--primary);} .stat-card.green::after{background:var(--secondary);} .stat-card.orange::after{background:var(--accent);} .stat-card.red::after{background:var(--danger);}
.stat-icon { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px; }
.stat-icon.purple{background:rgba(108,92,231,.1);color:var(--primary);} .stat-icon.green{background:rgba(0,184,148,.1);color:var(--secondary);} .stat-icon.orange{background:rgba(253,203,110,.2);color:#E17055;} .stat-icon.red{background:rgba(225,112,85,.1);color:var(--danger);}
.stat-value { font-size:24px; font-weight:800; color:var(--text); }
.stat-label { font-size:12px; color:var(--text-light); margin-top:2px; font-weight:500; }

.search-container { padding:0 20px; margin-bottom:16px; }
.search-box { display:flex; align-items:center; background:white; border-radius:16px; padding:12px 16px; box-shadow:var(--shadow); gap:10px; }
.search-box i { color:var(--text-light); font-size:18px; }
.search-box input { flex:1; border:none; outline:none; font-size:15px; font-family:inherit; background:transparent; color:var(--text); }

.section-header { display:flex; align-items:center; justify-content:space-between; padding:0 20px; margin-bottom:14px; }
.section-header h3 { font-size:18px; font-weight:700; }
.section-header .see-all { font-size:13px; color:var(--primary); font-weight:600; cursor:pointer; border:none; background:none; font-family:inherit; }

.product-list { padding:0 20px; display:flex; flex-direction:column; gap:12px; }
.product-card { background:white; border-radius:18px; padding:16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; transition:all .3s; position:relative; overflow:hidden; }
.product-card:active { transform:scale(.98); }
.product-card.out-of-stock { border-left:4px solid var(--danger); }
.product-card.low-stock { border-left:4px solid var(--accent); }
.product-emoji { width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
.product-emoji.cat-grocery{background:#E8F5E9;} .product-emoji.cat-electronics{background:#E3F2FD;} .product-emoji.cat-clothing{background:#F3E5F5;} .product-emoji.cat-food{background:#FFF3E0;} .product-emoji.cat-other{background:#F5F5F5;}
.product-info { flex:1; min-width:0; }
.product-name { font-size:15px; font-weight:700; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.product-meta { display:flex; gap:12px; font-size:12px; color:var(--text-light); flex-wrap:wrap; }
.product-meta span { display:flex; align-items:center; gap:4px; }
.product-meta .profit { color:var(--secondary); font-weight:600; }
.product-meta .loss { color:var(--danger); font-weight:600; }
.product-qty { text-align:center; flex-shrink:0; }
.product-qty .qty-num { font-size:20px; font-weight:800; color:var(--primary); }
.product-qty .qty-label { font-size:10px; color:var(--text-light); font-weight:500; }
.product-actions { display:flex; gap:6px; margin-top:10px; }
.product-actions button { flex:1; padding:8px; border:none; border-radius:10px; font-size:12px; font-weight:600; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; transition:all .2s; }
.product-actions button:active { transform:scale(.95); }
.btn-sell { background:linear-gradient(135deg,#00B894,#55EFC4); color:white; }
.btn-edit { background:rgba(108,92,231,.1); color:var(--primary); }
.btn-delete { background:rgba(225,112,85,.1); color:var(--danger); }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:white; padding:8px 16px; padding-bottom:max(8px,env(safe-area-inset-bottom)); display:flex; justify-content:space-around; box-shadow:0 -4px 30px rgba(0,0,0,.06); border-radius:24px 24px 0 0; z-index:1000; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 12px; border:none; background:none; cursor:pointer; transition:all .3s; border-radius:12px; position:relative; }
.nav-item.active { background:rgba(108,92,231,.08); }
.nav-item i { font-size:20px; color:var(--text-light); transition:all .3s; }
.nav-item.active i { color:var(--primary); }
.nav-item span { font-size:10px; font-weight:600; color:var(--text-light); font-family:inherit; }
.nav-item.active span { color:var(--primary); }
.nav-badge { position:absolute; top:2px; right:4px; width:18px; height:18px; background:var(--danger); color:white; border-radius:50%; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }

.page { display:none; }
.page.active { display:block; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:5000; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(4px); }
.modal-overlay.active { display:flex; animation:fadeIn .3s ease; }
.modal { background:white; border-radius:28px 28px 0 0; padding:24px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; animation:slideUp .3s ease; }
@keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
.modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
.modal h3 { font-size:20px; font-weight:800; margin-bottom:20px; }

/* MONTHLY REPORT STYLES */
.report-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed var(--border); }
.report-header h2 { font-size: 22px; color: var(--primary); margin-bottom: 5px; }
.report-header p { font-size: 13px; color: var(--text-light); }
.report-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.report-box { background: var(--bg); padding: 12px; border-radius: 12px; text-align: center; }
.report-box .rb-val { font-size: 18px; font-weight: 800; color: var(--text); }
.report-box .rb-label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
.report-box.profit .rb-val { color: var(--secondary); }
.report-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
.report-table th { text-align: left; padding: 10px; background: var(--bg); color: var(--text-light); font-weight: 600; border-radius: 8px 8px 0 0; }
.report-table td { padding: 10px; border-bottom: 1px solid var(--border); }
.report-table tr:last-child td { border-bottom: none; }
.report-footer { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 2px dashed var(--border); font-size: 11px; color: var(--text-light); }

.history-item { background:white; border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; }
.history-icon { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.history-icon.sold{background:rgba(0,184,148,.1);color:var(--secondary);} .history-icon.added{background:rgba(108,92,231,.1);color:var(--primary);} .history-icon.outofstock{background:rgba(225,112,85,.1);color:var(--danger);} .history-icon.edited{background:rgba(253,203,110,.2);color:#E17055;} .history-icon.deleted{background:rgba(225,112,85,.1);color:var(--danger);}
.history-info { flex:1; }
.history-info h4 { font-size:14px; font-weight:600; }
.history-info p { font-size:12px; color:var(--text-light); margin-top:2px; }
.history-time { font-size:11px; color:var(--text-light); font-weight:500; white-space:nowrap; }

.sub-card { background:linear-gradient(135deg,#6C5CE7,#A29BFE); border-radius:24px; padding:28px 24px; margin:20px; color:white; position:relative; overflow:hidden; }
.sub-card::before { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; background:rgba(255,255,255,.1); border-radius:50%; }
.sub-card .crown { font-size:40px; margin-bottom:12px; }
.sub-card h3 { font-size:22px; font-weight:800; margin-bottom:6px; }
.sub-card p { font-size:14px; opacity:.9; line-height:1.5; }
.sub-price { display:flex; align-items:baseline; gap:4px; margin-top:16px; }
.sub-price .amount { font-size:36px; font-weight:800; }
.sub-price .period { font-size:14px; opacity:.8; }
.sub-features { padding:0 20px; }
.sub-feature { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.sub-feature:last-child { border-bottom:none; }
.sub-feature i { width:32px; height:32px; background:rgba(108,92,231,.1); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:14px; }
.sub-feature span { font-size:14px; font-weight:500; }

.qr-section { padding:20px; text-align:center; }
.qr-box { background:white; border-radius:20px; padding:24px; box-shadow:var(--shadow-lg); display:inline-block; margin-bottom:16px; }
.qr-box img { width:200px; height:200px; }
.upi-id-box { background:var(--bg); border-radius:14px; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.upi-id-box .upi-text { font-size:13px; font-weight:600; color:var(--text); font-family:monospace; }
.upi-id-box .copy-btn { background:var(--primary); color:white; border:none; padding:8px 14px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }

.empty-state { text-align:center; padding:60px 30px; }
.empty-state .emoji { font-size:64px; margin-bottom:16px; }
.empty-state h3 { font-size:18px; font-weight:700; margin-bottom:8px; }
.empty-state p { font-size:14px; color:var(--text-light); line-height:1.5; }

.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px); background:var(--text); color:white; padding:14px 24px; border-radius:14px; font-size:14px; font-weight:600; z-index:9999; transition:transform .4s cubic-bezier(.68,-.55,.265,1.55); box-shadow:0 8px 30px rgba(0,0,0,.2); display:flex; align-items:center; gap:8px; max-width:90%; font-family:inherit; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.success{background:var(--secondary);} .toast.error{background:var(--danger);} .toast.warning{background:#FDCB6E;color:var(--text);}

.fab { position:fixed; bottom:90px; right:20px; width:56px; height:56px; background:linear-gradient(135deg,#6C5CE7,#A29BFE); border:none; border-radius:18px; color:white; font-size:24px; cursor:pointer; box-shadow:0 6px 25px rgba(108,92,231,.4); z-index:999; display:flex; align-items:center; justify-content:center; transition:all .3s; }
.fab:active { transform:scale(.9); }

.filter-chips { display:flex; gap:8px; padding:0 20px; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.filter-chips::-webkit-scrollbar { display:none; }
.chip { padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; border:2px solid var(--border); background:white; color:var(--text-light); cursor:pointer; white-space:nowrap; font-family:inherit; transition:all .3s; }
.chip.active { background:var(--primary); color:white; border-color:var(--primary); }

.limit-warning { background:linear-gradient(135deg,#FDCB6E,#F39C12); border-radius:16px; padding:16px 20px; margin:0 20px 16px; display:flex; align-items:center; gap:12px; color:white; }
.limit-warning i { font-size:24px; }
.limit-warning .limit-text h4 { font-size:14px; font-weight:700; }
.limit-warning .limit-text p { font-size:12px; opacity:.9; margin-top:2px; }
.limit-warning .upgrade-btn { margin-left:auto; background:white; color:#F39C12; border:none; padding:8px 16px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }

.profile-header { text-align:center; padding:30px 20px; }
.profile-avatar { width:80px; height:80px; border-radius:24px; background:linear-gradient(135deg,#6C5CE7,#A29BFE); display:flex; align-items:center; justify-content:center; font-size:32px; color:white; margin:0 auto 14px; font-weight:800; }
.profile-name { font-size:20px; font-weight:800; }
.profile-email { font-size:14px; color:var(--text-light); margin-top:4px; }
.profile-plan { display:inline-block; padding:6px 16px; border-radius:20px; font-size:12px; font-weight:700; margin-top:10px; }
.profile-plan.free { background:rgba(108,92,231,.1); color:var(--primary); }
.profile-plan.premium { background:linear-gradient(135deg,#FDCB6E,#F39C12); color:white; }
.profile-plan.expired { background:rgba(225,112,85,.1); color:var(--danger); }
.settings-list { padding:0 20px; }
.settings-item { display:flex; align-items:center; gap:14px; padding:16px; background:white; border-radius:16px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer; border:none; width:100%; text-align:left; font-family:inherit; transition:all .2s; }
.settings-item:active { transform:scale(.98); }
.settings-item .s-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.settings-item .s-text { flex:1; }
.settings-item .s-text h4 { font-size:14px; font-weight:600; }
.settings-item .s-text p { font-size:12px; color:var(--text-light); margin-top:2px; }
.settings-item .s-arrow { color:var(--text-light); font-size:14px; }

.sell-qty-control { display:flex; align-items:center; justify-content:center; gap:20px; margin:20px 0; }
.sell-qty-btn { width:48px; height:48px; border-radius:14px; border:2px solid var(--border); background:white; font-size:22px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; color:var(--primary); font-family:inherit; }
.sell-qty-btn:active { background:var(--primary); color:white; border-color:var(--primary); }
.sell-qty-num { font-size:36px; font-weight:800; color:var(--text); min-width:60px; text-align:center; }

@media (min-width:500px) {

let currentLang = localStorage.getItem('SI_lang') || 'en';

function t(key, vars){
  let str = (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || key;
  if (vars){ for (const k in vars){ str = str.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]); } }
  return str;
}

function applyStaticTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('.lang-opt').forEach(b=> b.classList.remove('active'));
  document.querySelectorAll(".lang-opt").forEach(b=>{ if((b.textContent.trim()==='हिन्दी'&&currentLang==='hi')||(b.textContent.trim()==='English'&&currentLang==='en')) b.classList.add('active'); });
  const lbl=document.getElementById('topLangLabel'); if(lbl) lbl.textContent = currentLang==='hi'?'हिं':'EN';
  document.documentElement.lang = currentLang;
  document.body.classList.toggle('hindi', currentLang==='hi');
}

function setLang(lang){
  if(lang===currentLang) return;
  currentLang = lang;
  localStorage.setItem('SI_lang', lang);
  applyStaticTranslations();
  refreshDynamicUI();
  showToast(t('lang_switched'),'success');
}
function toggleLang(){ setLang(currentLang==='en'?'hi':'en'); }

function refreshDynamicUI(){
  updateGreeting();
  renderProducts();
  updateStats();
  renderHistory();
  updateSubscriptionUI();
  updateProfileUI();
  updateTodayProfit();
}

// ===================== PREMIUM VALIDITY CHECKER (28 DAYS + 7 DAYS GRACE) =====================
async function checkPremiumValidity() {
  if (!currentUser || currentUser.id === 'demo_user') return;
  if (!currentUser.premiumActivatedAt) return;

  const activatedDate = new Date(currentUser.premiumActivatedAt);
  const today = new Date();
  const diffTime = Math.abs(today - activatedDate);
  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

  currentUser.premiumDaysUsed = diffDays;

  if (diffDays <= 28) {
    currentUser.plan = 'premium';
    currentUser.graceStatus = 'active';
  } 
  else if (diffDays > 28 && diffDays <= 35) {
    currentUser.plan = 'premium';
    currentUser.graceStatus = 'grace';
    const daysLeft = 35 - diffDays;
    
    setTimeout(() => {
      showToast(`⚠️ Premium expires in ${daysLeft} day(s)! Renew now.`, 'warning');
    }, 1500);
    
    addNotification('premium_expiry', `⏰ Your premium expires in ${daysLeft} day(s)!`, 'warning');
  } 
  else {
    currentUser.plan = 'expired';
    currentUser.graceStatus = 'expired';
    
    await db.collection('users').doc(currentUser.id).update({ 
      plan: 'expired' 
    });
    
    setTimeout(() => {
      showToast('⚠️ Premium expired! Only first 5 products accessible. Renew to unlock all.', 'warning');
    }, 1500);
  }
}

function addNotification(type, message, level) {
  try {
    let notifs = JSON.parse(localStorage.getItem('SI_notifs_' + currentUser.id) || '[]');
    notifs.unshift({ type, message, level, time: new Date().toISOString() });
    if (notifs.length > 20) notifs = notifs.slice(0, 20);
    localStorage.setItem('SI_notifs_' + currentUser.id, JSON.stringify(notifs));
  } catch(e) {}
}

// ===================== DATA (FIRESTORE) =====================
async function loadData(){ 
  if(!currentUser || currentUser.id === 'demo_user') {
    try{ products=JSON.parse(localStorage.getItem('SI_products_demo')||'[]'); historyLog=JSON.parse(localStorage.getItem('SI_history_demo')||'[]'); }catch(e){products=[];historyLog=[];}
    refreshDynamicUI();
    return; 
  } 
  try{ 
    const userDoc = await db.collection('users').doc(currentUser.id).get();
    if (userDoc.exists) {
      const userData = userDoc.data();
      currentUser.name = userData.name || currentUser.name;
      currentUser.shopName = userData.shopName || 'My Shop';
      currentUser.phone = userData.phone || '';
      currentUser.plan = userData.plan || 'free';
      currentUser.premiumActivatedAt = userData.premiumActivatedAt ? userData.premiumActivatedAt.toDate().toISOString() : null;
    }

    const docRef = db.collection('users').doc(currentUser.id).collection('inventory').doc('data');
    const docSnap = await docRef.get();
    if (docSnap.exists) {
      const data = docSnap.data();
      products = data.products || [];
      historyLog = data.historyLog || [];
    } else {
      products = [];
      historyLog = [];
    }
    refreshDynamicUI();
  }catch(e){
    console.error(e);
    products=[];
    historyLog=[];
    refreshDynamicUI();
  } 
}

async function saveData(){ 
  if(!currentUser || currentUser.id === 'demo_user') {
    try{ localStorage.setItem('SI_products_demo',JSON.stringify(products)); localStorage.setItem('SI_history_demo',JSON.stringify(historyLog)); }catch(e){console.error(e);}
    return; 
  }
  try{ 
    const docRef = db.collection('users').doc(currentUser.id).collection('inventory').doc('data');
    await docRef.set({
      products: products,
      historyLog: historyLog,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  }catch(e){
    console.error(e);
  } 
}

function findProd(id){ for(var i=0;i<products.length;i++){ if(products[i].id===id) return products[i]; } return null; }

function saveProduct(){
  var name=document.getElementById('prodName').value.trim();
  var category=document.getElementById('prodCategory').value;
  var buyPrice=parseFloat(document.getElementById('prodBuyPrice').value);
  var sellPrice=parseFloat(document.getElementById('prodSellPrice').value);
  var quantity=parseInt(document.getElementById('prodQty').value);
  var unit=document.getElementById('prodUnit').value;
  var editId=document.getElementById('editProductId').value;
  if(!name){ showToast(t('t_need_name'),'error'); return; }
  if(isNaN(buyPrice)||buyPrice<0){ showToast(t('t_need_buy'),'error'); return; }
  if(isNaN(sellPrice)||sellPrice<0){ showToast(t('t_need_sell'),'error'); return; }
  if(isNaN(quantity)||quantity<0){ showToast(t('t_need_qty'),'error'); return; }
  if(editId){
    var idx=-1; for(var i=0;i<products.length;i++){ if(products[i].id===editId){idx=i;break;} }
    if(idx!==-1){ Object.assign(products[idx],{name,category,buyPrice,sellPrice,quantity,unit,updatedAt:new Date().toISOString()}); addHistory('edited',name,t('hd_edited',{name,q:quantity,u:unitLabel(unit)})); showToast(t('t_updated'),'success'); }
  } else {
    if (currentUser.plan === 'expired' && products.length >= 5) {
      showToast('🔒 Premium expired! Renew to add more products.', 'warning');
      closeModal('productModal');
      return;
    }
    if(currentUser.plan==='free'&&products.length>=5){ showToast(t('t_limit2'),'warning'); closeModal('productModal'); return; }
    products.push({id:'prod_'+Date.now(),name,category,buyPrice,sellPrice,quantity,unit,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
    addHistory('added',name,t('hd_added',{name,q:quantity,u:unitLabel(unit),price:sellPrice})); showToast(t('t_added'),'success');
  }
  saveData(); renderProducts(); updateStats(); updateHistoryBadge(); closeModal('productModal');
}

function deleteProduct(id){
  var product=findProd(id); if(!product)return;
  if(confirm(t('confirm_delete',{name:product.name}))){ products=products.filter(p=>p.id!==id); addHistory('deleted',product.name,t('hd_deleted',{name:product.name})); saveData(); renderProducts(); updateStats(); showToast(t('t_deleted'),'success'); }
}

function openSellModal(id){
  var product=findProd(id); if(!product)return;
  if(product.quantity<=0){ showToast(t('t_oos_now'),'error'); return; }
  sellQty=1;
  document.getElementById('sellProductId').value=id;
  document.getElementById('sellProductName').textContent=product.name;
  document.getElementById('sellProductPrice').textContent='₹'+product.sellPrice+' '+t('per_unit');
  document.getElementById('sellAvailableQty').textContent=product.quantity+' '+unitLabel(product.unit);
  document.getElementById('sellQtyNum').textContent='1';
  updateSellTotal();
  document.getElementById('sellModal').classList.add('active');
}

function changeSellQty(delta){
  var product=findProd(document.getElementById('sellProductId').value); if(!product)return;
  sellQty=Math.max(1,Math.min(sellQty+delta,product.quantity));
  document.getElementById('sellQtyNum').textContent=sellQty; updateSellTotal();
}

function updateSellTotal(){
  var product=findProd(document.getElementById('sellProductId').value); if(!product)return;
  document.getElementById('sellTotalAmount').textContent='₹'+(sellQty*product.sellPrice).toFixed(2);
}

function confirmSell(){
  var product=findProd(document.getElementById('sellProductId').value); if(!product)return;
  if(sellQty>product.quantity){ showToast(t('t_not_enough'),'error'); return; }
  product.quantity-=sellQty; product.updatedAt=new Date().toISOString();
  var totalAmount=sellQty*product.sellPrice; 
  var profit=(product.sellPrice-product.buyPrice)*sellQty;
  addHistory('sold', product.name, t('hd_sold',{q:sellQty,u:unitLabel(product.unit),total:totalAmount.toFixed(2),profit:profit.toFixed(2)}), totalAmount, profit, sellQty);
  if(product.quantity===0){ addHistory('outofstock',product.name,t('hd_oos',{name:product.name})); showToast(t('t_out_warn',{name:product.name}),'warning'); }
  else if(product.quantity<=5){ showToast(t('t_low',{name:product.name,q:product.quantity}),'warning'); }
  else { showToast(t('t_sold',{q:sellQty,u:unitLabel(product.unit),name:product.name}),'success'); }
  saveData(); renderProducts(); updateStats(); updateHistoryBadge(); updateTodayProfit(); closeModal('sellModal');
}

function addHistory(type, productName, description, revenue=0, profit=0, qty=0){
  historyLog.unshift({id:'hist_'+Date.now(), type, productName, description, revenue, profit, qty, timestamp:new Date().toISOString()});
  if(historyLog.length>100) historyLog=historyLog.slice(0,100);
}

function renderHistory(){
  var filter=document.getElementById('historyFilter').value;
  var filteredHistory = filter==='all'?historyLog:historyLog.filter(h=>h.type===filter);
  var container=document.getElementById('historyList');
  if(filteredHistory.length===0){ container.innerHTML='<div class="empty-state" style="padding:40px 20px"><div class="emoji">📋</div><h3>'+t('hist_empty_h')+'</h3><p>'+t('hist_empty_p')+'</p></div>'; }
  else {
    var icons={sold:'fa-cart-shopping',added:'fa-plus',outofstock:'fa-triangle-exclamation',edited:'fa-pen',deleted:'fa-trash'};

    for(var i=0;i<filteredHistory.length;i++){ var h=filteredHistory[i];
      html+='<div class="history-item"><div class="history-icon '+h.type+'"><i class="fas '+(icons[h.type]||'fa-circle')+'"></i></div><div class="history-info"><h4>'+h.productName+'</h4><p>'+h.description+'</p></div><div class="history-time">'+getTimeAgo(h.timestamp)+'</div></div>';
    }

  else {
    var oosHtml='';

    }
    oosContainer.innerHTML=oosHtml;

// ===================== RENDER PRODUCTS =====================
function renderProducts(){
  var search=document.getElementById('searchInput').value.toLowerCase();
  var filtered=products.filter(p=> p.name.toLowerCase().indexOf(search)!==-1 && (currentFilter==='all'||p.category===currentFilter));
  var container=document.getElementById('productList');
  
  if(filtered.length===0){
    container.innerHTML = search
      ? '<div class="empty-state"><div class="emoji">🔍</div><h3>'+t('empty_no_results_h')+'</h3><p>'+t('empty_no_results_p')+'</p></div>'
      : '<div class="empty-state"><div class="emoji">📦</div><h3>'+t('empty_no_products_h')+'</h3><p>'+t('empty_no_products_p')+'</p></div>';
    return;
  }

  const isExpired = currentUser && currentUser.plan === 'expired';
  let accessibleCount = 0;

  var html='';
  for(var i=0;i<filtered.length;i++){ 
    var p=filtered[i];
    var profit=p.sellPrice-p.buyPrice; 
    var profitClass=profit>=0?'profit':'loss';
    var stockClass = p.quantity===0?'out-of-stock':(p.quantity<=5?'low-stock':'');
    var oosBadge = p.quantity===0?'<span class="oos-badge">'+t('oos_badge')+'</span>':'';
    var qtyColor = p.quantity===0?'var(--danger)':(p.quantity<=5?'#F39C12':'var(--primary)');

    const isLocked = isExpired && accessibleCount >= 5;
    
    if (!isLocked) accessibleCount++;

    if (isLocked) {
      html+='<div class="product-card" style="opacity:0.6;filter:grayscale(0.5);border-left:4px solid var(--text-light);">';
      html+='<div class="product-emoji cat-'+p.category+'">'+getCategoryEmoji(p.category)+'</div>';
      html+='<div class="product-info"><div class="product-name">'+p.name+'</div>';
      html+='<div class="product-meta"><span style="color:var(--danger);font-weight:700">🔒 Locked</span></div>';
      html+='<div style="margin-top:8px;font-size:11px;color:var(--text-light);line-height:1.4">Premium expired. Renew to unlock this product.</div>';
      html+='</div></div>';
    } else {
      var sellDisabled = p.quantity<=0?'disabled style="opacity:0.5"':'';
      html+='<div class="product-card '+stockClass+'">'+oosBadge;
      html+='<div class="product-emoji cat-'+p.category+'">'+getCategoryEmoji(p.category)+'</div>';
      html+='<div class="product-info"><div class="product-name">'+p.name+'</div>';
      html+='<div class="product-meta"><span>'+t('buy')+': ₹'+p.buyPrice+'</span><span>'+t('sell_lbl')+': ₹'+p.sellPrice+'</span><span class="'+profitClass+'">'+(profit>=0?'+':'')+'₹'+profit.toFixed(0)+t('per_unit')+'</span></div>';
      html+='<div class="product-actions"><button class="btn-sell" onclick="openSellModal(\''+p.id+'\')" '+sellDisabled+'><i class="fas fa-cart-shopping"></i> '+t('sell')+'</button><button class="btn-edit" onclick="editProduct(\''+p.id+'\')"><i class="fas fa-pen"></i></button><button class="btn-delete" onclick="deleteProduct(\''+p.id+'\')"><i class="fas fa-trash"></i></button></div></div>';
      html+='<div class="product-qty"><div class="qty-num" style="color:'+qtyColor+'">'+p.quantity+'</div><div class="qty-label">'+unitLabel(p.unit)+'</div></div></div>';
    }
  }

  if (isExpired && products.length > 5) {
    html += '<div style="margin-top:20px;background:linear-gradient(135deg,#FDCB6E,#F39C12);border-radius:16px;padding:20px;text-align:center;color:white;">';
    html += '<div style="font-size:32px;margin-bottom:8px">🔒</div>';
    html += '<h3 style="font-size:16px;font-weight:700;margin-bottom:6px">Unlock All ' + products.length + ' Products</h3>';
    html += '<p style="font-size:13px;opacity:0.95;margin-bottom:14px">Your premium has expired. Renew now to access all products and continue selling.</p>';
    html += '<button onclick="navigateTo(\'subscriptionPage\')" style="background:white;color:#F39C12;border:none;padding:10px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Renew Premium - ₹99</button>';
    html += '</div>';
  }

  container.innerHTML=html;
}

// ===================== STATS & REPORTS =====================
function updateStats(){
  document.getElementById('statProducts').textContent=products.length;
  var totalRevenue=0;
  for(var i=0;i<historyLog.length;i++){ if(historyLog[i].type==='sold'){ totalRevenue += (historyLog[i].revenue || 0); } }
  document.getElementById('statRevenue').textContent='₹'+totalRevenue.toFixed(0);
  var lowStock=products.filter(p=>p.quantity>0&&p.quantity<=5).length;
  var outStock=products.filter(p=>p.quantity===0).length;
  document.getElementById('statLowStock').textContent=lowStock;
  document.getElementById('statOutStock').textContent=outStock;
  document.getElementById('limitWarning').style.display=(currentUser&&currentUser.plan==='free'&&products.length>=4)?'flex':'none';
}

function updateTodayProfit(){
  const today = new Date().toDateString();
  let todayProfit = 0;
  historyLog.forEach(h => {
    if (h.type === 'sold' && new Date(h.timestamp).toDateString() === today) {
      todayProfit += (h.profit || 0);
    }
  });
  document.getElementById('todayProfitAmount').textContent = '₹' + todayProfit.toFixed(2);
}

function openMonthlyReport(){
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthName = now.toLocaleString(currentLang === 'hi' ? 'hi-IN' : 'en-US', { month: 'long', year: 'numeric' });
  
  document.getElementById('reportShopName').textContent = currentUser.shopName || 'My Shop';
  document.getElementById('reportVendorName').textContent = currentUser.name || 'Vendor';
  document.getElementById('reportPhone').textContent = currentUser.phone ? '📞 ' + currentUser.phone : '';
  document.getElementById('reportDateRange').textContent = monthName + " (1st - " + now.getDate() + ")";
  document.getElementById('reportGenDate').textContent = "Generated on: " + now.toLocaleDateString();

  const monthSales = historyLog.filter(h => {
    if (h.type !== 'sold') return false;
    const d = new Date(h.timestamp);
    return d >= firstDay && d <= now;
  });

  let totalRev = 0, totalProf = 0, totalItems = 0;
  const dailyData = {};

  monthSales.forEach(h => {
    const dateStr = new Date(h.timestamp).toLocaleDateString();
    if (!dailyData[dateStr]) dailyData[dateStr] = { rev: 0, prof: 0, items: 0, details: [] };
    const rev = h.revenue || 0;
    const prof = h.profit || 0;
    const qty = h.qty || 1;
    dailyData[dateStr].rev += rev;
    dailyData[dateStr].prof += prof;
    dailyData[dateStr].items += qty;
    dailyData[dateStr].details.push(h.productName + " (x" + qty + ")");
    totalRev += rev;
    totalProf += prof;
    totalItems += qty;
  });

  document.getElementById('repTotalSales').textContent = '₹' + totalRev.toFixed(0);
  document.getElementById('repTotalProfit').textContent = '₹' + totalProf.toFixed(0);
  document.getElementById('repTotalItems').textContent = totalItems;

  const tbody = document.getElementById('reportTableBody');
  tbody.innerHTML = '';
  if (Object.keys(dailyData).length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-light)">'+t('no_sales')+'</td></tr>';
  } else {
    const sortedDates = Object.keys(dailyData).sort((a,b) => new Date(b) - new Date(a));
    sortedDates.forEach(date => {
      const d = dailyData[date];
      const row = `<tr>
        <td><strong>${date}</strong></td>
        <td style="font-size:12px;color:var(--text-light)">${d.details.join(', ')}</td>
        <td style="font-weight:600">₹${d.rev.toFixed(0)}</td>
        <td style="font-weight:700;color:var(--secondary)">₹${d.prof.toFixed(0)}</td>
      </tr>`;
      tbody.innerHTML += row;
    });
  }
  document.getElementById('reportModal').classList.add('active');
}

function downloadReportPDF(){
  const element = document.getElementById('monthlyReportContent');
  const opt = {
    margin: 10,
    filename: `Smart_Inventory_Report_${currentUser.shopName || 'Shop'}_${new Date().toISOString().split('T')[0]}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  showToast('Generating PDF...', 'success');
  html2pdf().set(opt).from(element).save().then(() => {
    showToast(t('t_data_exp'), 'success');
  });
}

// ===================== SUBSCRIPTION =====================
function updateSubscriptionUI(){
  var info=document.getElementById('currentPlanInfo');
  if(currentUser.plan==='premium'){
    const daysUsed = currentUser.premiumDaysUsed || 0;
    const daysLeft = Math.max(0, 28 - daysUsed);
    const isGrace = currentUser.graceStatus === 'grace';
    
    if (isGrace) {
      const graceDaysLeft = 35 - daysUsed;
      info.innerHTML = '<span style="color:#F39C12;font-weight:600">⚠️ Grace Period: ' + graceDaysLeft + ' day(s) left</span><br><span style="font-size:12px">Renew now to keep all features!</span>';
    } else {
      info.innerHTML = '<span style="color:var(--secondary);font-weight:600">'+t('plan_premium')+'</span><br><span style="font-size:12px">' + daysLeft + ' days remaining</span>';
    }
  } 
  else if (currentUser.plan === 'expired') {
    info.innerHTML = '<span style="color:var(--danger);font-weight:600">🔒 Premium Expired</span><br><span style="font-size:12px">Only first 5 products accessible. Renew to unlock all.</span>';
  }
  else { 
    info.innerHTML = t('plan_free',{used:products.length}); 
  }
}

// ===================== PAYMENT =====================
function showPaymentModal(){
  if(currentUser.plan==='premium' && currentUser.graceStatus !== 'grace'){ showToast(t('t_already_prem'),'success'); return; }
  document.getElementById('paymentStep1').style.display='block';
  document.getElementById('paymentStep2').style.display='none';
  document.getElementById('paymentStep3').style.display='none';
  document.getElementById('otpInput').value='';
  document.getElementById('paymentModal').classList.add('active');
}

function generateRequestCode(){
  requestCodeNumber=Math.floor(1000+Math.random()*9000);
  currentRequestCode='REQ-'+requestCodeNumber;
  localStorage.setItem('SI_pendingCode_'+currentUser.id,currentRequestCode);
  localStorage.setItem('SI_pendingTime_'+currentUser.id,new Date().toISOString());
  document.getElementById('requestCodeDisplay').textContent=currentRequestCode;
  document.getElementById('paymentStep1').style.display='none';
  document.getElementById('paymentStep2').style.display='block';
  showToast(t('t_req_gen'),'success');
}

function sendWhatsApp(){
  if(!currentRequestCode){ showToast(t('t_no_req'),'error'); return; }
  var msg='Namaste! 🙏\n\nMaine Smart Inventory Premium ke liye payment kar diya hai.\n\n📋 Request Code: '+currentRequestCode+'\n💰 Amount: ₹99\n👤 Name: '+(currentUser.name||'User')+'\n📧 Email: '+(currentUser.email||'N/A')+'\n\nPayment screenshot attach kar raha hoon. Please OTP bhejo.\n\nThank you!';
  window.open('https://wa.me/919628655528?text='+encodeURIComponent(msg),'_blank');
  showToast(t('t_wa_open'),'success');
}

function verifyOTP(){
  var otp=document.getElementById('otpInput').value.trim();
  if(!otp||otp.length!==4){ showToast(t('t_enter_otp'),'error'); return; }
  if(!requestCodeNumber){ showToast(t('t_no_req'),'error'); return; }
  var exp=(requestCodeNumber+1234).toString(); if(exp.length>4) exp=exp.slice(-4);
  if(otp===exp){ activatePremium(); } else { showToast(t('t_wrong_otp'),'error'); }
}

function activatePremium(){
  currentUser.plan = 'premium';
  currentUser.premiumActivatedAt = new Date().toISOString();
  currentUser.graceStatus = 'active';
  currentUser.premiumDaysUsed = 0;
  
  db.collection('users').doc(currentUser.id).update({ 
    plan: 'premium',
    premiumActivatedAt: firebase.firestore.Timestamp.now()
  });
  
  document.getElementById('paymentStep2').style.display='none';
  document.getElementById('paymentStep3').style.display='block';
  showToast(t('t_prem_act'),'success');
  refreshDynamicUI();
}

function copyUPI(){
  var upiId='akashji124421@ptyes';
  if(navigator.clipboard){ navigator.clipboard.writeText(upiId).then(()=>showToast(t('t_upi_copied'),'success')).catch(()=>fallbackCopy(upiId)); } else fallbackCopy(upiId);
}

function fallbackCopy(text){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast(t('t_upi_copied'),'success'); }

// ===================== PROFILE =====================
function updateProfileUI(){
  if(!currentUser)return;
  document.getElementById('profileAvatar').textContent=currentUser.name.charAt(0).toUpperCase();
  document.getElementById('profileName').textContent=currentUser.name;
  document.getElementById('profileEmail').textContent=currentUser.email;
  var planEl=document.getElementById('profilePlan');
  if(currentUser.plan==='premium'){
    const daysUsed = currentUser.premiumDaysUsed || 0;
    const daysLeft = Math.max(0, 28 - daysUsed);
    planEl.textContent='👑 '+(currentLang==='hi'?'प्रीमियम ('+daysLeft+' दिन शेष)':'PREMIUM ('+daysLeft+' days left)');
    planEl.className='profile-plan premium';
  }
  else if(currentUser.plan==='expired'){
    planEl.textContent='🔒 '+(currentLang==='hi'?'प्रीमियम समाप्त':'PREMIUM EXPIRED');
    planEl.className='profile-plan expired';
  }
  else { 
    planEl.textContent=currentLang==='hi'?'फ़्री प्लान':'FREE PLAN'; 
    planEl.className='profile-plan free'; 
  }
}

// ===================== UTILITIES =====================
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function showToast(message,type){ type=type||'success'; var toast=document.getElementById('toast'); toast.textContent=message; toast.className='toast '+type; setTimeout(()=>toast.classList.add('show'),10); setTimeout(()=>toast.classList.remove('show'),3000); }
function updateGreeting(){ var h=new Date().getHours(); var g=h<12?t('good_morning'):(h<17?t('good_afternoon'):t('good_evening')); document.getElementById('greetingText').textContent=g+'! 👋'; }
function getCategoryEmoji(cat){ return {grocery:'🛒',electronics:'📱',clothing:'👕',food:'🍔',other:'📦'}[cat]||'📦'; }
function unitLabel(u){ return {pcs:t('u_pcs'),kg:t('u_kg'),ltr:t('u_ltr'),box:t('u_box'),dozen:t('u_dozen')}[u]||u; }
function getTimeAgo(ts){ var s=Math.floor((new Date()-new Date(ts))/1000); if(s<60)return t('just_now'); var m=Math.floor(s/60); if(m<60)return t('mins_ago',{n:m}); var hr=Math.floor(m/60); if(hr<24)return t('hours_ago',{n:hr}); return t('days_ago',{n:Math.floor(hr/24)}); }

function showNotifications(){
  var oos=products.filter(p=>p.quantity<=0), low=products.filter(p=>p.quantity>0&&p.quantity<=5);
  var html='';
  
  // Premium expiry notifications
  if (currentUser && currentUser.graceStatus === 'grace') {
    const daysLeft = 35 - (currentUser.premiumDaysUsed || 0);
    html += '<div class="history-item"><div class="history-icon edited"><i class="fas fa-clock"></i></div><div class="history-info"><h4>⏰ Premium Expiring Soon</h4><p>Your premium will expire in ' + daysLeft + ' day(s). Renew now!</p></div></div>';
  } else if (currentUser && currentUser.plan === 'expired') {
    html += '<div class="history-item"><div class="history-icon outofstock"><i class="fas fa-lock"></i></div><div class="history-info"><h4>🔒 Premium Expired</h4><p>Only first 5 products accessible. Renew to unlock all.</p></div></div>';
  }
  
  if(oos.length===0&&low.length===0&&html===''){ html='<div class="empty-state" style="padding:30px"><div class="emoji">✅</div><h3>'+t('notif_clear_h')+'</h3><p>'+t('notif_clear_p')+'</p></div>'; }
  else {
    if(oos.length>0){ html+='<h4 style="margin-bottom:10px;color:var(--danger)">'+t('notif_oos')+'</h4>'; for(var i=0;i<oos.length;i++){ var p=oos[i]; html+='<div class="history-item"><div class="history-icon outofstock"><i class="fas fa-triangle-exclamation"></i></div><div class="history-info"><h4>'+p.name+'</h4><p>'+t('quantity_is',{u:unitLabel(p.unit)})+'</p></div></div>'; } }
    if(low.length>0){ html+='<h4 style="margin:16px 0 10px;color:#F39C12">'+t('notif_low')+'</h4>'; for(var j=0;j<low.length;j++){ var q=low[j]; html+='<div class="history-item"><div class="history-icon edited"><i class="fas fa-exclamation"></i></div><div class="history-info"><h4>'+q.name+'</h4><p>'+t('only_left',{q:q.quantity,u:unitLabel(q.unit)})+'</p></div></div>'; } }
  }
  document.getElementById('notificationList').innerHTML=html;
  document.getElementById('notificationModal').classList.add('active');
}

function exportData(){
  var data={products,history:historyLog,exportedAt:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='SmartInventory_data_'+new Date().toISOString().split('T')[0]+'.json'; a.click(); URL.revokeObjectURL(url);
  showToast(t('t_data_exp'),'success');
}

function showAbout(){ alert(t('about_text')); }

document.querySelectorAll('.modal-overlay').forEach(function(ov){ ov.addEventListener('click',function(e){ if(e.target===this) this.classList.remove('active'); }); });
