<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Retail Ledger Pro</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4f46e5"><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}.container{max-width:1180px;margin:auto;padding:24px}.hide{display:none!important}.auth-screen{min-height:100vh;display:grid;place-items:center;background:#f1f5f9}.auth-card{width:min(90vw,440px);background:#fff;border-radius:20px;padding:30px 28px;box-shadow:0 12px 28px #0f172a14;text-align:center}.notice{color:#475569;font-size:14px}.auth-box{display:grid;gap:12px;margin-top:18px}.auth-box input,.form-group input{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}.auth-box button,.form-button,button{padding:12px 16px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.button-secondary{background:#64748b}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.status-badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ecfeff;color:#0f766e;font-weight:700;font-size:12px}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:16px;margin:20px 0}.mini-card,.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 18px #0f172a0f}.mini-card span{display:block;color:#64748b;font-size:13px}.mini-card strong{display:block;font-size:28px;margin-top:8px}.grid{display:grid;grid-template-columns:1.2fr 1.6fr 1.3fr;gap:16px}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:13px;color:#475569;margin-bottom:6px}.inventory-item,.history-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}.inventory-meta strong{display:block}.inventory-meta small{color:#64748b}.inventory-actions{display:flex;gap:8px}.small-btn{padding:8px 10px;font-size:12px;border-radius:8px}.error{color:#dc2626;font-size:13px;min-height:18px}@media(max-width:980px){.grid{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.summary-grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}}</style></head><body>
<section id="authScreen" class="auth-screen"><div class="auth-card"><div style="font-size:32px">🛍️</div><h2>Login</h2><p class="notice">Smart Retail Ledger</p><div class="auth-box"><input id="vendorName" placeholder="Owner Name"><input id="shopName" placeholder="Shop Name"><input id="vendorEmail" type="email" placeholder="Email Address"><input id="vendorPassword" type="password" placeholder="Password (6+ chars)"><div id="authMessage" class="error"></div><button id="signUpButton">Login</button></div></div></section>
<main class="container hide" id="appMain"><header class="header"><div><h1 id="displayShopName">Smart Retail Ledger</h1><p id="displayOwnerName" style="margin:4px 0;color:#64748b">Welcome Back</p><div class="status-badge">Supabase backend</div></div><div><button onclick="location.href='reports.html'">Reports</button> <button id="logoutButton" class="button-secondary">Logout</button></div></header><div class="summary-grid"><div class="mini-card"><span>Total Items</span><strong id="totalItems">0</strong></div><div class="mini-card"><span>Available Stock</span><strong id="availableStock">0</strong></div><div class="mini-card"><span>Low Stock</span><strong id="lowStockCount">0</strong></div><div class="mini-card"><span>Revenue</span><strong id="totalRevenue">₹0</strong></div></div><div class="grid"><section class="card"><h3>Log New Stock</h3><div class="form-group"><label>Physical Tag ID</label><input id="productId" placeholder="101"></div><div class="form-group"><label>Product Name</label><input id="productName" placeholder="Rice 5kg"></div><div class="form-group"><label>Purchase Price</label><input id="purchasePrice" type="number" min="0" placeholder="40"></div><div class="form-group"><label>Selling Price</label><input id="sellingPrice" type="number" min="0" placeholder="50"></div><div class="form-group"><label>Quantity</label><input id="quantity" type="number" min="1" placeholder="20"></div><button id="addStockButton">Add Stock</button></section><section class="card"><h3>Inventory List</h3><div id="inventoryList"></div></section><section class="card"><div class="header" style="margin:0"><h3 style="margin:0">History</h3><button id="clearHistoryButton" class="button-secondary">Clear</button></div><div id="historyList"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),cfg=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let inv=[],hist=[],profile=null,user=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const msg=t=>$('authMessage').textContent=t;
function render(){const available=inv.reduce((s,i)=>s+(Number(i.quantity)||0),0),low=inv.filter(i=>(Number(i.quantity)||0)<=5).length,revenue=inv.reduce((s,i)=>s+(Number(i.selling_price??i.sellingPrice)||0)*(Number(i.quantity)||0),0);$('totalItems').textContent=inv.length;$('availableStock').textContent=available;$('lowStockCount').textContent=low;$('totalRevenue').textContent='₹'+revenue.toLocaleString('en-IN');$('inventoryList').innerHTML=inv.length?inv.map((x,i)=>`<div class="inventory-item"><div class="inventory-meta"><strong>${esc(x.name)}</strong><small>${esc(x.id)} • Qty: ${Number(x.quantity)||0}</small></div><div class="inventory-actions"><button class="small-btn" data-sell="${i}">Sell</button><button class="small-btn" style="background:#ef4444" data-delete="${i}">Delete</button></div></div>`).join(''):'<p style="color:#64748b">No inventory items yet.</p>';$('historyList').innerHTML=hist.length?hist.slice().reverse().map(x=>`<div class="history-item"><div><strong>${esc(x.type)}</strong><br><small>${esc(x.message)}</small></div><small>${new Date(x.created_at||x.time).toLocaleString('en-IN')}</small></div>`).join(''):'<p style="color:#64748b">No history yet.</p>';document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sell(+b.dataset.sell));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(+b.dataset.delete))}
function show(){if(!profile){$('authScreen').classList.remove('hide');$('appMain').classList.add('hide');return}$('displayShopName').textContent=profile.shop_name||profile.shopName||'Smart Retail Ledger';$('displayOwnerName').textContent=profile.owner_name||profile.ownerName||'Welcome Back';$('authScreen').classList.add('hide');$('appMain').classList.remove('hide')}
async function load(){if(!user)return;const [i,h,p]=await Promise.all([cfg.from('inventory').select('*').eq('user_id',user.id).order('created_at'),cfg.from('activity').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(50),cfg.from('profiles').select('*').eq('id',user.id).maybeSingle()]);if(i.error||h.error)throw(i.error||h.error);inv=i.data||[];hist=h.data||[];profile=p.data||profile||{email:user.email};show();render()}
async function activity(type,message){const {data,error}=await cfg.from('activity').insert({user_id:user.id,type,message}).select().single();if(error)throw error;hist.push(data);hist=hist.slice(-50)}
async function sell(i){const x=inv[i];if(!x||Number(x.quantity)<=0)return alert('This item is out of stock.');const {error}=await cfg.from('inventory').update({quantity:Number(x.quantity)-1,updated_at:new Date().toISOString()}).eq('user_id',user.id).eq('id',x.id);if(error)return alert(error.message);await activity('Sale Recorded',`${x.name} sold: 1`);await load()}
async function remove(i){const x=inv[i];if(!x||!confirm(`Delete ${x.name||'this item'}?`))return;const {error}=await cfg.from('inventory').delete().eq('user_id',user.id).eq('id',x.id);if(error)return alert(error.message);await activity('Stock Removed',`${x.name} removed.`);await load()}
$('signUpButton').onclick=async()=>{const email=$('vendorEmail').value.trim(),password=$('vendorPassword').value,owner=$('vendorName').value.trim(),shop=$('shopName').value.trim();if(!email||password.length<6)return msg('Valid email aur 6+ character password enter karein.');msg('Please wait...');let r=await cfg.auth.signInWithPassword({email,password});if(r.error&&['Invalid login credentials','Email not confirmed'].indexOf(r.error.message)<0)return msg(r.error.message);if(r.error)return msg('Email confirm karke phir login karein.');user=r.data.user;profile={id:user.id,email,owner_name:owner,shop_name:shop};await cfg.from('profiles').upsert(profile);await load();msg('')};$('addStockButton').onclick=async()=>{const item={id:$('productId').value.trim(),name:$('productName').value.trim(),purchase_price:Number($('purchasePrice').value),selling_price:Number($('sellingPrice').value),quantity:Number($('quantity').value),user_id:user.id};if(!item.id||!item.name||item.quantity<1||item.purchase_price<0||item.selling_price<0)return alert('Please enter valid stock details.');if(inv.some(x=>String(x.id).toLowerCase()===item.id.toLowerCase()))return alert('Product ID already exists.');const {error}=await cfg.from('inventory').insert(item);if(error)return alert(error.message);await activity('Stock Added',`${item.name} added.`);['productId','productName','purchasePrice','sellingPrice','quantity'].forEach(x=>$(x).value='');await load()};$('clearHistoryButton').onclick=async()=>{if(!user)return;await cfg.from('activity').delete().eq('user_id',user.id);await load()};$('logoutButton').onclick=async()=>{await cfg.auth.signOut();user=null;profile=null;inv=[];hist=[];show();render()};cfg.auth.getSession().then(async({data})=>{user=data.session?.user||null;if(user)await load();else show();render()});cfg.auth.onAuthStateChange(async(_,session)=>{if(session?.user&&!user){user=session.user;await load()}else if(!session){user=null;profile=null;show()}})})();</script></body></html>
