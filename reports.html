<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports & Sales - Smart Retail Ledger</title><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:Arial,sans-serif}.container{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 8px 25px #0f172a12}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}button{border:0;border-radius:8px;padding:11px 16px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:18px;border:1px solid #e2e8f0;border-radius:12px}.stat span{display:block;color:#64748b;font-size:13px}.stat strong{display:block;font-size:25px;margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}.empty{color:#64748b}@media(max-width:650px){.container{padding:14px}.top{align-items:flex-start;flex-direction:column}.top button{width:100%}.stats{grid-template-columns:1fr}}</style></head><body><main class="container"><div class="top card"><div><h1>📊 Reports & Sales</h1><p style="color:#64748b">Inventory, sales and activity overview</p></div><button onclick="location.href='index.html'">← Back to Dashboard</button></div><section class="stats"><div class="stat"><span>Total Products</span><strong id="products">0</strong></div><div class="stat"><span>Total Sales</span><strong id="sales">0</strong></div><div class="stat"><span>Sales Revenue</span><strong id="revenue">₹0</strong></div></section><section class="card"><h2>Current Inventory</h2><div class="table-wrap"><table><thead><tr><th>Product</th><th>Tag ID</th><th>Price</th><th>Available</th></tr></thead><tbody id="inventory"></tbody></table></div></section><section class="card"><h2>Sales History</h2><div id="history"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const [{data:inv=[]},{data:hist=[]}]=await Promise.all([db.from('inventory').select('*').eq('user_id',session.user.id).order('created_at'),db.from('activity').select('*').eq('user_id',session.user.id).eq('type','Sale Recorded').order('created_at',{ascending:false})]);let revenue=0;hist.forEach(x=>{const m=String(x.message).match(/^(.*) sold: (\d+)/),p=inv.find(i=>i.name===m?.[1]);revenue+=(+(m?.[2]||0))*(+(p?.selling_price||0))});document.getElementById('products').textContent=inv.length;document.getElementById('sales').textContent=hist.length;document.getElementById('revenue').textContent='₹'+revenue.toLocaleString('en-IN');document.getElementById('inventory').innerHTML=inv.length?inv.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.id)}</td><td>₹${x.selling_price||0}</td><td>${x.quantity||0}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No inventory items yet.</td></tr>';document.getElementById('history').innerHTML=hist.length?hist.map(x=>`<p><b>${esc(x.type)}</b><br><span style="color:#64748b">${esc(x.message)} · ${new Date(x.created_at).toLocaleString('en-IN')}</span></p>`).join(''):'<p class="empty">No sales recorded yet.</p>'})()</script></body></html>
